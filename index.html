<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#170d14">
</head>
<body>
<title>Caderno de Tags</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: três painéis (pastas e tags | lista | folha) que viram uma pilha navegável no celular; modo foco deixa só a folha */
/* Tema único escuro em tons de rosa: fundo ameixa, folha vinho, destaque rosa-chiclete */
:root {
  --bg: #170d14;          /* fundo da lista: ameixa quase preta */
  --panel: #1e1119;       /* barra lateral */
  --paper: #25141f;       /* folha da nota */
  --fg: #f7e4ef;          /* texto: rosa bem claro */
  --muted: #b98fa8;       /* texto secundário: rosa acinzentado */
  --line: #42253a;        /* bordas: vinho */
  --accent: #ff85c0;      /* destaque: rosa vivo */
  --accent-soft: #4d1f3c; /* fundo de item selecionado */
  --danger: #ff7a66;      /* apagar: coral, para não confundir com o rosa */
  --rule: #341c2c;        /* linhas do caderno e fundos de código */
  --scrim: rgb(12 4 9 / .7);
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-note: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
::selection { background: #8a2f63; color: #fff; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: 240px 310px 1fr; }

/* Barra lateral */
.tags { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
.brand { font-weight: 700; font-size: 17px; padding-inline: 8px; letter-spacing: -0.01em; }
.brand small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }
.tags nav { display: flex; flex-direction: column; gap: 4px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding-inline: 8px; margin: 10px 0 4px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 2px; }
.sec-head .label { margin: 0; }
.add-btn { border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
.add-btn:hover { color: var(--accent); background: var(--rule); }
.taglist { display: flex; flex-direction: column; gap: 1px; }
.tagrow { display: flex; align-items: center; border-radius: 6px; }
.tagrow:hover { background: var(--rule); }
.tagrow.trash-row { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; border-radius: 0; }
.tagbtn { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; border: 0; background: none; padding: 7px 8px; border-radius: 6px; text-align: left; }
.tagbtn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tagbtn .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.tagbtn .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tagbtn .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tagmore { border: 0; background: none; color: var(--muted); padding: 4px 8px; border-radius: 6px; font-size: 15px; line-height: 1; }
.tagmore:hover { color: var(--fg); background: var(--line); }
@media (hover: hover) {
  .tagmore { opacity: 0; }
  .tagrow:hover .tagmore, .tagmore:focus-visible { opacity: 1; }
}
.frow { padding-left: calc(var(--depth, 0) * 14px); }
.twisty { border: 0; background: none; color: var(--muted); width: 18px; height: 22px; padding: 0; font-size: 10px; flex: none; border-radius: 4px; }
.twisty[aria-expanded="true"] > span { transform: rotate(90deg); }
.twisty > span { display: inline-block; }
.twisty-sp { width: 18px; flex: none; }
.ficon { width: 14px; height: 14px; flex: none; color: var(--muted); display: inline-flex; }
.ficon svg { width: 100%; height: 100%; }
.drop-over { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-soft) !important; }
.tools summary { cursor: pointer; font-size: 13px; font-weight: 600; padding: 6px 8px; border-radius: 6px; color: var(--muted); }
.tools summary:hover { color: var(--fg); }
.tools-body { display: flex; flex-direction: column; gap: 10px; padding: 8px 0 0; }
.tool-btns { display: flex; flex-wrap: wrap; gap: 6px; padding-inline: 8px; }
.sync { padding-inline: 8px; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.sync .row { flex-wrap: wrap; }
.sync strong { color: var(--fg); font-weight: 600; overflow-wrap: anywhere; }
.save-state { margin-top: auto; font-size: 12px; color: var(--muted); padding-inline: 8px; line-height: 1.4; }

/* Lista */
.list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
.list-head { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.row { display: flex; gap: 8px; align-items: center; }
.field { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); }
.sort { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.sort select { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 4px 6px; font-size: 12.5px; }
.btn { border: 1px solid var(--line); background: var(--paper); padding: 8px 12px; border-radius: 7px; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.small { padding: 5px 9px; font-size: 12.5px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--paper); }
.filter-line { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; align-items: center; }
.link { border: 0; background: none; color: var(--accent); padding: 0; font-size: 12px; font-weight: 600; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-width: 0; }
.crumbs .cur { color: var(--fg); font-weight: 600; }
.crumb-actions { display: flex; gap: 12px; }
.notes { overflow-y: auto; flex: 1; }
.item { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.item:hover { background: var(--panel); }
.item[aria-current="true"] { background: var(--paper); box-shadow: inset 3px 0 0 var(--accent); }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .p { color: var(--muted); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4; }
.item .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.folder-item { flex-direction: row; align-items: center; gap: 10px; background: var(--panel); }
.folder-item .t { flex: 1; min-width: 0; }
.folder-item .ficon { width: 16px; height: 16px; }
.folder-item .n { font-size: 12px; color: var(--muted); }
.fpath { display: inline-flex; align-items: center; gap: 4px; }
.fpath .ficon { width: 11px; height: 11px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 500; background: var(--rule); color: var(--fg); }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.pin { color: var(--accent); font-weight: 700; }
.prog { font-weight: 600; }

.empty { padding: 28px 18px; color: var(--muted); line-height: 1.55; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.empty strong { color: var(--fg); font-size: 15px; }

/* Folha */
.sheet { display: flex; flex-direction: column; min-width: 0; background: var(--paper); }
.sheet-bar { display: flex; align-items: center; gap: 4px; padding: 10px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sheet-bar .spacer { flex: 1; }
.sheet-bar .when { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
.ghost { border: 0; background: none; padding: 6px 9px; border-radius: 6px; color: var(--muted); font-weight: 500; }
.ghost:hover { background: var(--rule); color: var(--fg); }
.ghost.on, .ghost[aria-pressed="true"] { color: var(--accent); }
.ghost.danger:hover { color: var(--danger); }
.back { display: none; }
.confirm { display: flex; gap: 6px; align-items: center; font-size: 13px; flex-wrap: wrap; }
.trash-note { font-size: 12.5px; color: var(--danger); font-weight: 600; }

.sheet-body { flex: 1; overflow-y: auto; padding: 26px clamp(16px, 5vw, 56px) 40px; display: flex; flex-direction: column; gap: 14px; }
.title-in { border: 0; background: none; font-size: 26px; font-weight: 700; letter-spacing: -0.015em; padding: 0; width: 100%; outline: none; }
.title-in::placeholder, .body-in::placeholder { color: var(--muted); opacity: .6; }
.title-view { font-size: 26px; font-weight: 700; letter-spacing: -0.015em; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.note-meta-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.folder-pick { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.folder-sel { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 3px 10px; font-size: 12px; color: var(--fg); max-width: 220px; }
.tag-edit { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag-edit .chip { padding: 3px 4px 3px 9px; font-size: 12px; }
.tag-edit .chip.inline, .tag-edit .chip.inherit { padding-right: 9px; background: none; border: 1px dashed var(--line); }
.tag-edit .chip.inherit { border-style: solid; color: var(--muted); }
.tag-edit .chip button { border: 0; background: none; color: var(--muted); padding: 0 4px; line-height: 1; font-size: 14px; }
.tag-edit .chip button:hover { color: var(--danger); }
.tag-in { border: 1px dashed var(--line); background: none; border-radius: 99px; padding: 3px 10px; font-size: 12px; min-width: 0; width: 150px; outline: none; }
.tag-in:focus { border-color: var(--accent); border-style: solid; }
.editor { display: flex; flex-direction: column; gap: 8px; flex: 1; position: relative; }
.body-in {
  flex: 1; min-height: 50vh; width: 100%; resize: none; border: 0; outline: none; padding: 0;
  font-family: var(--font-note); font-size: 14px; line-height: 26px;
  background-color: transparent; color: var(--fg); caret-color: var(--accent);
  background-image: linear-gradient(to bottom, transparent 25px, var(--rule) 25px);
  background-size: 100% 26px; background-attachment: local;
}
.body-in.dragging { outline: 2px dashed var(--accent); outline-offset: 6px; border-radius: 4px; }
.help-row { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.md-help { font-size: 12px; color: var(--muted); font-family: var(--font-note); }
.ac { position: sticky; bottom: 8px; align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .4); padding: 4px; display: flex; flex-direction: column; min-width: 240px; max-width: 100%; z-index: 5; }
.ac .ac-title { font-size: 11px; color: var(--muted); padding: 4px 10px; text-transform: uppercase; letter-spacing: .08em; }
.ac button { border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ac button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.backlinks { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; max-width: 72ch; }
.backlinks .label { padding: 0; margin: 0; }
.backlinks ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.backlinks li { min-width: 0; }
.backlinks button { border: 0; background: none; padding: 0; color: var(--accent); text-align: left; font-weight: 600; }
.backlinks .ctx { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-note); }
.sheet-empty { flex: 1; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; line-height: 1.8; }
.kbd { font-family: var(--font-note); font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }

/* Markdown renderizado */
.md { font-size: 15px; line-height: 1.65; max-width: 72ch; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: .7em; }
.md > * { margin: 0; }
.md h2 { font-size: 21px; line-height: 1.3; margin-top: .4em; text-wrap: balance; }
.md h3 { font-size: 18px; line-height: 1.3; margin-top: .3em; }
.md h4 { font-size: 15.5px; }
.md ul, .md ol { padding-left: 1.4em; display: flex; flex-direction: column; gap: .2em; }
.md li { margin-left: calc(var(--ind, 0) * 1.3em); }
.md li.task { list-style: none; margin-left: calc(var(--ind, 0) * 1.3em - 1.4em); }
.md li.task label { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; }
.md li.task input { margin-top: .3em; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.md li.task.done > label > span { color: var(--muted); text-decoration: line-through; }
.md code { font-family: var(--font-note); font-size: .88em; background: var(--rule); padding: 1px 5px; border-radius: 4px; }
.md pre { background: var(--rule); padding: 12px 14px; border-radius: 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); }
.md a { color: var(--accent); }
.md hr { border: 0; border-top: 1px solid var(--line); width: 100%; }
.md .tagref { border: 0; cursor: pointer; font-size: .82em; vertical-align: 1px; }
.md .tagref:hover { background: var(--accent-soft); }
.md .muted { color: var(--muted); }
.md img { display: block; max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); background: var(--rule); margin-block: 4px; }
.md img:not([src]) { width: 220px; height: 120px; }
.img-missing { display: inline-block; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 13px; }
.wikilink { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-weight: 600; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; cursor: pointer; }
.wikilink.missing { color: var(--muted); text-decoration-style: dashed; font-weight: 500; }

/* Painel sobreposto e aviso */
.overlay { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 20; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: min(440px, 100%); max-height: calc(100% - 32px); overflow-y: auto; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgb(0 0 0 / .35); }
.panel h2 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; overflow-wrap: anywhere; }
.panel h2 .dot { width: 10px; height: 10px; border-radius: 50%; }
.panel h2 .ficon { width: 18px; height: 18px; }
.panel .hint { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.panel section { display: flex; flex-direction: column; gap: 8px; }
.panel .label { padding: 0; margin: 0; }
.panel select.field { padding: 7px 8px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
.swatch[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 2px var(--paper); }
.panel-foot { display: flex; justify-content: flex-end; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--paper); padding: 10px 14px; border-radius: 9px; display: flex; gap: 14px; align-items: center; font-size: 13.5px; z-index: 30; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgb(0 0 0 / .25); }
.toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }

/* Modo foco */
.app.focus { grid-template-columns: 1fr; }
.app.focus .tags, .app.focus .list { display: none; }
.app.focus .sheet-body > * { width: 100%; max-width: 760px; margin-inline: auto; }

/* Celular: uma coluna por vez; a barra lateral vira uma fileira de botões */
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .tags { border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; gap: 10px; }
  .save-state { display: none; }
  .brand { padding: 0; }
  .tags nav { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 2px; }
  .tags nav .taglist, .sec-head { display: contents; }
  .tags nav .label { display: none; }
  .add-btn { border: 1px solid var(--line); border-radius: 99px; padding: 5px 11px; flex: none; order: 99; }
  .tagrow { flex: none; border: 1px solid var(--line); border-radius: 99px; }
  .tagrow.trash-row { margin: 0; padding: 0; border-top: 1px solid var(--line); border-radius: 99px; order: 100; }
  .tagbtn { padding: 5px 4px 5px 11px; border-radius: 99px; }
  .tagrow > .tagbtn:only-child { padding-right: 11px; }
  .frow { padding-left: 0; }
  .frow:not([data-depth="0"]) { display: none; }
  .twisty, .twisty-sp { display: none; }
  .tools summary { padding-inline: 0; }
  .tool-btns, .sync { padding-inline: 0; }
  .list, .sheet { grid-row: 2; grid-column: 1; min-height: 0; border-right: 0; }
  .app.editing .list, .app.editing .tags { display: none; }
  .app.editing { grid-template-rows: 1fr; }
  .app.editing .sheet { grid-row: 1; }
  .app:not(.editing) .sheet { display: none; }
  .back { display: inline-block; }
  .focus-btn { display: none; }
  .sheet-bar { padding: 10px 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  .item, .tagrow, .btn, .ghost { transition: background-color .12s, border-color .12s, color .12s; }
  .twisty > span { transition: transform .12s; }
}
</style>

<div class="app" id="app">
  <aside class="tags">
    <div class="brand">Caderno de Tags<small id="count-line">carregando…</small></div>
    <nav aria-label="Navegar nas notas">
      <div class="taglist" id="mainlist"></div>
      <div class="sec-head">
        <div class="label">Pastas</div>
        <button class="add-btn" id="new-folder" title="Criar uma pasta">+ Pasta</button>
      </div>
      <div class="taglist" id="folderlist"></div>
      <div class="label" id="tags-label">Tags</div>
      <div class="taglist" id="taglist"></div>
      <div class="taglist" id="trashlist"></div>
    </nav>
    <details class="tools">
      <summary>Backup e sincronização</summary>
      <div class="tools-body">
        <div class="tool-btns">
          <button class="btn small" id="exp-json" title="Todas as notas e pastas, inclusive a lixeira, para importar depois">Exportar JSON</button>
          <button class="btn small" id="exp-md" title="Todas as notas em um arquivo .md para ler em qualquer editor">Exportar Markdown</button>
          <button class="btn small" id="imp-btn" title="Arquivos .json, .md ou .txt">Importar…</button>
          <input type="file" id="imp-file" accept=".json,.md,.markdown,.txt" multiple hidden>
        </div>
        <div class="sync" id="sync"></div>
      </div>
    </details>
    <div class="save-state" id="save-state"></div>
  </aside>

  <section class="list">
    <div class="list-head">
      <div class="row">
        <input class="field" id="search" type="search" placeholder="Buscar nas notas" aria-label="Buscar nas notas">
        <button class="btn primary" id="new-btn" title="Nova nota (Ctrl+Alt+N)">+ Nova</button>
      </div>
      <label class="sort" for="sort">Ordenar por
        <select id="sort">
          <option value="updated">Editadas por último</option>
          <option value="created">Criadas por último</option>
          <option value="title">Título (A–Z)</option>
        </select>
      </label>
      <div class="filter-line" id="filter-line" hidden></div>
    </div>
    <div class="notes" id="notes"></div>
  </section>

  <main class="sheet" id="sheet"></main>
</div>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="img-file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>

<script src="config.js"></script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const CFG = window.CADERNO_CONFIG || {};
  const IN_ARTIFACT = !!(window.claude && window.claude.use);
  const HAS_CLOUD = !IN_ARTIFACT && !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
  const K = { notes: "caderno-tags-notas", meta: "caderno-tags-meta", tombs: "caderno-tags-apagadas", prefs: "caderno-tags-prefs" };

  const BUCKET = "imagens", MAX_IMG = 5 * 1024 * 1024;
  const FOLDER_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5A1.5 1.5 0 0 1 3 3h3l1.5 1.5H13a1.5 1.5 0 0 1 1.5 1.5v6a1.5 1.5 0 0 1-1.5 1.5H3A1.5 1.5 0 0 1 1.5 12z" fill="currentColor"/></svg>';

  let notes = {};                                     // id -> nota
  let meta = { colors: {}, folders: {}, updated: 0 }; // cores das tags e pastas
  let tombs = {};                                     // notas apagadas para sempre (para a sincronização não trazê-las de volta)

  let mode = "local";                                 // "local" | "db" (claude.ai) | "cloud" (Supabase)
  let ready = false;

  let onOverlayClose = null;
  const timers = {}, writing = {};

  // ---------- preferências e armazenamento local ----------
  function lsGet(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  const prefs = Object.assign({ sort: "updated", preview: false, open: [] }, lsGet(K.prefs, {}));
  if (!Array.isArray(prefs.open)) prefs.open = [];
  const savePrefs = () => lsSet(K.prefs, prefs);
  function saveLocal() { if (mode === "db") return; lsSet(K.notes, notes); lsSet(K.meta, meta); lsSet(K.tombs, tombs); }
  function setState(t) { $("save-state").textContent = t; }

  // ---------- gravação ----------
  async function persist(ids) {

  }
  async function dbWrite(id) {

    try {
      do {
        writing[id].again = false;

        else if (notes[id]) await dbCol.doc(id).set({ ...notes[id] });

    } catch (e) {

  const IMG_REF_RE = /!\[[^\]]*\]\(img:([^)\s]+)\)/g;
  const imageKeys = (body) => [...body.matchAll(IMG_REF_RE)].map((m) => m[1]);
  function purge(ids) {
    ids = [].concat(ids);

    for (const id of ids) {

      clearTimeout(timers[id]); delete timers[id];

  // ---------- utilidades ----------
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function dotEl(tag) { const d = el("span", { class: "dot" }); d.style.background = tagColor(tag); return d; }

          name: String(f.name || "Pasta").slice(0, 80),

        while (p) { if (seen.has(p)) { f.parentId = null; break; } seen.add(p); p = folders[p] && folders[p].parentId; }
      }
    }
    return { colors, folders, updated: Number(d && d.updated) || 0 };
  }

  // ---------- pastas ----------
  const folderOf = (n) => (n.folderId && meta.folders[n.folderId] ? n.folderId : null);
  function childrenOf(pid) {

  function chain(fid) {

  const folderTags = (fid) => [...new Set(chain(fid).flatMap((id) => meta.folders[id].tags))];
  const folderPathName = (fid) => chain(fid).map((id) => meta.folders[id].name).join(" / ");
  function folderIcon(fid) {

  function folderOptions(sel, banned) {
    (function walk(pid, depth) {
      for (const c of childrenOf(pid)) {

        walk(c.id, depth + 1);

  }
  function expand(fid) { for (const id of chain(fid)) if (!prefs.open.includes(id)) prefs.open.push(id); savePrefs(); }
  function newFolder(parentId) {
    const id = "f" + uid();
    meta.folders[id] = { name: "Nova pasta", parentId: parentId || null, tags: [], created: Date.now() };

  function ensureFolderPath(path) {
    let parent = null;

  // ---------- tags ----------
  const TAG_RE = /(^|[\s(\[,;*_>])#([\p{L}\p{N}_][\p{L}\p{N}_-]*)/gu;

    const out = []; let code = false;

      if (code) continue;

  const allTags = () => [...new Set([
    ...Object.values(notes).filter((n) => !n.deletedAt).flatMap(ownTags),
    ...Object.values(meta.folders).flatMap((f) => f.tags),

  // ---------- links entre notas ----------
  const WIKI_RE = /\[\[([^\[\]|\n]+?)(?:\|([^\[\]\n]+?))?\]\]/g;
  const titleKey = (t) => String(t).trim().toLowerCase();
  function findByTitle(t) {
    const k = titleKey(t); if (!k) return null;
    let best = null;
    for (const [id, n] of Object.entries(notes)) if (!n.deletedAt && titleKey(n.title) === k && (!best || n.updated > notes[best].updated)) best = id;
    return best;
  }
  function backlinksOf(id) {
    const k = titleKey(notes[id].title); if (!k) return [];
    const out = [];
    for (const [oid, o] of Object.entries(notes)) {
      if (oid === id || o.deletedAt) continue;
      for (const m of o.body.matchAll(WIKI_RE)) {

        const line = o.body.split("\n").find((l) => l.includes(m[0])) || "";

  function relinkTitle(oldT, newT, selfId) {

    const re = new RegExp(`\\[\\[\\s*${escRe(oldT.trim())}\\s*(\\|[^\\]\\n]*)?\\]\\]`, "gi");
    const ids = [];
    for (const [id, n] of Object.entries(notes)) {
      if (id === selfId) continue;
      const b = n.body.replace(re, (_, alias) => `[[${newT.trim()}${alias || ""}]]`);
      if (b !== n.body) { n.body = b; n.updated = Date.now(); ids.push(id); }
    }

  }

  // ---------- markdown ----------
  const TASK_RE = /^\s*(?:[-*+]\s+)?\[( |x|X)\]\s?(.*)$/;
  function imgHtml(alt, src) {
    const a = esc(alt || "imagem");
    if (src.startsWith("img:")) return `<img class="nimg" data-key="${esc(src.slice(4))}" alt="${a}" loading="lazy">`;
    if (/^https:\/\//.test(src) || /^\/(?!\/)/.test(src)) return `<img class="nimg" src="${esc(src)}" alt="${a}" loading="lazy">`;
    return null;
  }
  function inlineMd(src) {
    const slots = [];

    s = s.replace(WIKI_RE, (_, t, alias) => {
      const ex = !!findByTitle(t), tt = esc(t.trim());
      return keep(`<button type="button" class="wikilink${ex ? "" : " missing"}" data-title="${tt}" title="${ex ? "Abrir" : "Criar"} a nota “${tt}”">${esc((alias || t).trim())}</button>`);
    });
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, u) => { const h = imgHtml(alt, u); return h ? keep(h) : m; });
    s = s.replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g, (_, t, u) => keep(`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>`));
    s = s.replace(/\bhttps?:\/\/[^\s<>"'\u0000]+/g, (u) => {
      const tail = (u.match(/[.,;:!?)\]]+$/) || [""])[0];
      u = u.slice(0, u.length - tail.length);
      return keep(`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`) + tail;
    });

      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/__(.+?)__/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*(?!\s)(.+?)(?<!\s)\*(?!\w)/g, "$1<em>$2</em>")
      .replace(/(^|[^\w])_(?!\s)(.+?)(?<!\s)_(?!\w)/g, "$1<em>$2</em>")

  function indentOf(line) { return Math.min(Math.floor(line.match(/^\s*/)[0].replace(/\t/g, "  ").length / 2), 4); }

    return body.split("\n").filter((l) => l.trim() && !/^\s*```/.test(l)).slice(0, 3).map((l) => l
      .replace(TASK_RE, (_, x, t) => (x === " " ? "☐ " : "☑ ") + t)
      .replace(/^\s*(#{1,6}|>|[-*+]|\d+[.)])\s+/, "")
      .replace(/!\[[^\]]*\]\([^)]*\)/g, "[imagem]")
      .replace(WIKI_RE, (_, t, a) => (a || t).trim())
      .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
      .replace(/\*\*|__|~~|`/g, "")).join(" · ");

  // ---------- imagens ----------
  const signed = {}; // caminho no Storage -> { url, exp }
  async function resolveImages(root) {
    const imgs = [...root.querySelectorAll("img[data-key]")];
    if (!imgs.length) return;
    const missing = (i, msg) => i.replaceWith(el("span", { class: "img-missing", text: msg }));
    if (mode !== "cloud" || !sb) { imgs.forEach((i) => missing(i, "Imagem guardada na nuvem: entre na sincronização para ver.")); return; }
    const need = [...new Set(imgs.map((i) => i.dataset.key))].filter((k) => !(signed[k] && signed[k].exp > Date.now()));
    if (need.length) {
      const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(need, 3600);
      if (!error && data) for (const d of data) if (d.signedUrl && d.path) signed[d.path] = { url: d.signedUrl, exp: Date.now() + 50 * 60e3 };
    }

    }
  }
  const canImages = () => (mode === "cloud" && !!sbUser) || (mode === "db" && !!assetsCap);
  async function shrink(file) {
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);

      if (webp && webp.type === "image/webp" && (webp.size < file.size || scale < 1)) return webp;

  }
  async function uploadImage(file) {

      if (error) throw error;
      return "img:" + path;
    }
    if (mode === "db" && assetsCap) { const r = await assetsCap.upload(blob); return r.url; }
    return null;
  }
  let upCount = 0;
  async function insertImages(files, body, id) {
    if (!canImages()) {
      toast(IN_ARTIFACT ? "Não dá para guardar imagens nesta visualização." : "Para colar imagens, entre na sincronização em “Backup e sincronização”.");
      return;
    }
    for (const f of files) {
      const ph = `![Enviando imagem ${++upCount}…]()`;
      const pos = body.selectionStart, v = body.value;
      const ins = (pos > 0 && v[pos - 1] !== "\n" ? "\n" : "") + ph + "\n";
      body.value = v.slice(0, pos) + ins + v.slice(body.selectionEnd);
      body.selectionStart = body.selectionEnd = pos + ins.length;
      notes[id].body = body.value; touch(id);
      let ref = null, failed = false;
      try { ref = await uploadImage(f); } catch { failed = true; }
      const n = notes[id]; if (!n) continue;
      const rep = ref ? `![imagem](${ref})` : "";
      if (body.isConnected) {
        const p = body.selectionStart, at = body.value.indexOf(ph);
        n.body = body.value.replace(ph, rep);
        body.value = n.body;
        const np = at >= 0 && at < p ? p + rep.length - ph.length : p;
        body.selectionStart = body.selectionEnd = Math.max(0, np);
      } else n.body = n.body.replace(ph, rep);
      touch(id); renderList();
      if (failed) toast("Não foi possível enviar a imagem. Confira a conexão e tente de novo.");
      else if (!ref) toast("Use imagens PNG, JPG, WebP ou GIF de até 5 MB.");
    }
  }

  // ---------- render ----------
  function visible() {
    const q = query.trim().toLowerCase();
    const inTrash = view === "__trash";
    let arr = Object.entries(notes).map(([id, n]) => ({ id, ...n })).filter((n) => !!n.deletedAt === inTrash);
    if (!inTrash && view) {
      if (view.startsWith("f:")) {
        const fid = view.slice(2) || null;
        if (q && fid) { const set = descendants(fid); arr = arr.filter((n) => set.has(folderOf(n))); }
        else if (!q) arr = arr.filter((n) => folderOf(n) === fid);
      } else arr = arr.filter((n) => { const ts = noteTags(n); return view === "__none" ? !ts.length : ts.includes(view); });
    }
    if (q) arr = arr.filter((n) => (n.title + "\n" + n.body + "\n" + noteTags(n).join(" ")).toLowerCase().includes(q));
    if (inTrash) return arr.sort((a, b) => b.deletedAt - a.deletedAt);
    const by = {
      updated: (a, b) => b.updated - a.updated,
      created: (a, b) => b.created - a.created,
      title: (a, b) => (a.title || "￿").localeCompare(b.title || "￿", "pt-BR", { sensitivity: "base" }),
    }[prefs.sort] || ((a, b) => b.updated - a.updated);
    return arr.sort((a, b) => (b.pinned - a.pinned) || by(a, b));
  }

  function navBtn(key, label, n, lead) {

  function renderNav() {
    const all = Object.values(notes);

    const counts = {}; let untagged = 0;
    for (const n of live) { const ts = noteTags(n); if (!ts.length) untagged++; for (const t of ts) counts[t] = (counts[t] || 0) + 1; }
    for (const f of Object.values(meta.folders)) for (const t of f.tags) if (!counts[t]) counts[t] = 0;
    const tags = Object.keys(counts).sort((a, b) => a.localeCompare(b, "pt-BR"));
    const nf = Object.keys(meta.folders).length;
    $("count-line").textContent = ready
      ? `${live.length} ${live.length === 1 ? "nota" : "notas"} · ${nf} ${nf === 1 ? "pasta" : "pastas"} · ${tags.length} ${tags.length === 1 ? "tag" : "tags"}`

    const total = (fid) => childrenOf(fid).reduce((s, c) => s + total(c.id), direct[fid] || 0);
    const fbox = $("folderlist"); fbox.replaceChildren();
    (function walk(pid, depth) {
      for (const f of childrenOf(pid)) {

        const tw = kids
          ? el("button", { class: "twisty", "aria-label": (isOpen ? "Recolher " : "Expandir ") + f.name, "aria-expanded": String(isOpen),
              onclick: () => { prefs.open = isOpen ? prefs.open.filter((x) => x !== f.id) : [...prefs.open, f.id]; savePrefs(); renderNav(); } }, el("span", { text: "▶" }))

        fbox.append(row);
        if (isOpen) walk(f.id, depth + 1);
      }
    })(null, 0);
    if (nf && direct[""]) fbox.append(el("div", { class: "tagrow frow", "data-drop": "", "data-depth": "0" }, el("span", { class: "twisty-sp" }), navBtn("f:", "Sem pasta", direct[""], null)));

    const tbox = $("taglist"); tbox.replaceChildren();

    if (untagged && tags.length) tbox.append(el("div", { class: "tagrow" }, navBtn("__none", "Sem tag", untagged, null)));
    $("trashlist").replaceChildren(el("div", { class: "tagrow trash-row" }, navBtn("__trash", "Lixeira", all.length - live.length, null)));
  }

  function renderSheet() {

        el("span", { class: "kbd", text: "Ctrl+Alt+P" }), " visualizar  ",
        el("span", { class: "kbd", text: "Ctrl+Alt+F" }), " modo foco")));

    }
    const id = current;
    const back = el("button", { class: "ghost back", text: "‹ Notas", onclick: () => { app.classList.remove("editing"); } });

      sheet.replaceChildren(

          el("button", { class: "ghost on", text: "Restaurar", onclick: () => { n.deletedAt = null; touch(id); view = null; renderAll(); toast("Nota restaurada"); } }),

      let before = n.title;
      title.addEventListener("focus", () => { before = n.title; });
      title.addEventListener("input", () => { n.title = title.value; changed(); });
      title.addEventListener("blur", () => { relinkTitle(before, n.title, id); before = n.title; });
      title.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); const b = $("note-body"); if (b) b.focus(); } });

    folderOptions(sel);
    sel.value = folderOf(n) || "";
    sel.addEventListener("change", () => moveNote(id, sel.value || null));
    const folderPick = el("label", { class: "folder-pick", for: "note-folder" }, folderIcon(folderOf(n)), sel);

    // Tags: as do campo têm ×; as escritas no texto aparecem tracejadas; as herdadas da pasta, com borda fina
    const tagBox = el("div", { class: "tag-edit" });
    const tagIn = el("input", { id: "note-tag", class: "tag-in", placeholder: "+ tag (Enter)", "aria-label": "Adicionar tag", list: "tag-suggest" });
    const dl = el("datalist", { id: "tag-suggest" });
    for (const t of allTags()) dl.append(el("option", { value: t }));
    function drawTags() {
      const inline = bodyTags(n.body).filter((t, i, a) => a.indexOf(t) === i && !n.tags.includes(t));
      const fromFolder = folderTags(folderOf(n)).filter((t) => !n.tags.includes(t) && !inline.includes(t));
      tagBox.replaceChildren(
        ...n.tags.map((t) => el("span", { class: "chip" }, dotEl(t), "#" + t,
          el("button", { "aria-label": "Remover tag " + t, text: "×", onclick: () => { n.tags = n.tags.filter((x) => x !== t); drawTags(); changed(); } }))),
        ...inline.map((t) => el("span", { class: "chip inline", title: "Tag escrita no texto da nota" }, dotEl(t), "#" + t)),
        ...fromFolder.map((t) => el("span", { class: "chip inherit", title: "Tag herdada da pasta" }, dotEl(t), "#" + t)),
        tagIn, dl);
    }
    function addTag() {
      const parts = tagIn.value.split(/[,\s]+/).map(normTag).filter(Boolean);
      let did = false;
      for (const t of parts) if (!n.tags.includes(t)) { n.tags.push(t); did = true; }
      tagIn.value = "";
      drawTags(); tagIn.focus();
      if (did) changed();
    }
    tagIn.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === ",") { e.preventDefault(); addTag(); }
      else if (e.key === "Backspace" && !tagIn.value && n.tags.length) { n.tags.pop(); drawTags(); tagIn.focus(); changed(); }
    });
    tagIn.addEventListener("blur", () => { if (tagIn.value.trim()) addTag(); });
    drawTags();

    let content;
    if (preview) {
      content = el("div", { class: "md", id: "note-preview", title: "Dois cliques para editar" });
      content.innerHTML = renderMd(n.body);
      content.addEventListener("change", (e) => {
        const cb = e.target.closest("input[type=checkbox]");
        if (!cb) return;
        const lines = n.body.split("\n"), i = +cb.dataset.line;

      });
      content.addEventListener("click", (e) => {

      resolveImages(content);
    } else {
      const body = el("textarea", { id: "note-body", class: "body-in", placeholder: "Escreva aqui…\n\nUse #tag no meio do texto, [[Outra nota]] para ligar notas, **negrito**, - listas e [ ] tarefas. Cole um print com Ctrl+V.", "aria-label": "Texto da nota", spellcheck: "true" });
      body.value = n.body;
      const ac = el("div", { class: "ac", role: "listbox", "aria-label": "Ligar a uma nota" }); ac.hidden = true;
      let acItems = [], acIdx = 0;
      const hideAc = () => { ac.hidden = true; acItems = []; };
      function drawAc() {
        ac.replaceChildren(el("div", { class: "ac-title", text: "Ligar a uma nota" }),
          ...acItems.map((it, i) => el("button", { type: "button", role: "option", "aria-selected": String(i === acIdx),
            onmousedown: (e) => { e.preventDefault(); pickAc(it.title); } }, it.label)));
      }
      function updateAc() {
        const m = body.value.slice(0, body.selectionStart).match(/\[\[([^\[\]\n|]*)$/);
        if (!m) { hideAc(); return; }
        const q = m[1].trim().toLowerCase();
        const titles = [...new Set(Object.entries(notes).filter(([oid, o]) => oid !== id && !o.deletedAt && o.title.trim()).map(([, o]) => o.title.trim()))];
        acItems = titles.filter((t) => t.toLowerCase().includes(q))
          .sort((a, b) => (a.toLowerCase().startsWith(q) ? 0 : 1) - (b.toLowerCase().startsWith(q) ? 0 : 1) || a.localeCompare(b, "pt-BR"))
          .slice(0, 6).map((t) => ({ title: t, label: t }));
        if (q && !titles.some((t) => t.toLowerCase() === q)) acItems.push({ title: m[1].trim(), label: `Criar “${m[1].trim()}”` });
        if (!acItems.length) { hideAc(); return; }
        acIdx = 0; ac.hidden = false; drawAc();
      }
      function pickAc(t) {
        const pos = body.selectionStart;
        const before = body.value.slice(0, pos).replace(/\[\[([^\[\]\n|]*)$/, "[[" + t + "]]");
        const after = body.value.slice(pos).replace(/^[^\[\]\n|]*\]\]/, "");
        body.value = before + after;
        body.selectionStart = body.selectionEnd = before.length;
        n.body = body.value; hideAc(); drawTags(); changed();
      }
      body.addEventListener("input", () => { n.body = body.value; when.textContent = "Editada agora"; drawTags(); changed(); updateAc(); });
      body.addEventListener("click", updateAc);
      body.addEventListener("blur", () => setTimeout(hideAc, 120));
      body.addEventListener("keydown", (e) => {
        if (ac.hidden) return;
        if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); acIdx = (acIdx + (e.key === "ArrowDown" ? 1 : -1) + acItems.length) % acItems.length; drawAc(); }
        else if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); pickAc(acItems[acIdx].title); }
        else if (e.key === "Escape") { e.preventDefault(); hideAc(); }
      });
      body.addEventListener("paste", (e) => {
        const files = [...((e.clipboardData && e.clipboardData.files) || [])].filter((f) => f.type.startsWith("image/"));
        if (files.length) { e.preventDefault(); insertImages(files, body, id); }
      });
      body.addEventListener("dragover", (e) => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); body.classList.add("dragging"); } });
      body.addEventListener("dragleave", () => body.classList.remove("dragging"));
      body.addEventListener("drop", (e) => {
        body.classList.remove("dragging");
        const files = [...e.dataTransfer.files].filter((f) => f.type.startsWith("image/"));

  function exportMd() {

    const md = list.map((n) => [

      n.tags.length ? "tags: " + n.tags.map((t) => "#" + t).join(" ") : null,

      if (/^#\s+/.test(lines[0] || "")) title = lines.shift().replace(/^#\s+/, "").trim();

        if (!list) { bad++; continue; }

          for (const [fid, fo] of Object.entries(m.folders)) if (!meta.folders[fid]) meta.folders[fid] = fo;

    try {
      await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js");
      sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
      sb.auth.onAuthStateChange((_ev, session) => { setTimeout(() => setCloudUser(session ? session.user : null), 0); });
      const { data } = await sb.auth.getSession();
      setCloudUser(data.session ? data.session.user : null);
    } catch {
      setState("Não foi possível carregar a sincronização. As notas continuam salvas neste navegador.");
    }
    renderSync();
  }
  function setCloudUser(u) {
    const before = sbUser && sbUser.id;
    sbUser = u;
    if (u) { mode = "cloud"; if (before !== u.id) cloudPull(); }
    else if (mode === "cloud") { mode = "local"; setState("Salvo neste navegador"); }
    renderSync();
  }
  async function cloudPush(ids) {
    if (!sb || !sbUser) return;
    const rows = ids.map((id) => {
      const data = id === "__meta" ? meta : (notes[id] || tombs[id]);
      return data ? { user_id: sbUser.id, id, data, updated_at: new Date(data.updated || Date.now()).toISOString() } : null;
    }).filter(Boolean);
    if (!rows.length) return;
    const { error } = await sb.from("notes").upsert(rows, { onConflict: "user_id,id" });
    setState(error ? "Sem conexão com a nuvem agora. As notas continuam salvas neste navegador." : "Sincronizado");
  }
  function mergeIn(id, d) {
    if (!d || typeof d !== "object") return;
    if (id === "__meta") { if ((d.updated || 0) > meta.updated) meta = sanitizeMeta(d); return; }
    if (timers[id]) return;
    const local = notes[id] || tombs[id];
    if (local && (d.updated || 0) <= local.updated) return;
    if (d.purged) { delete notes[id]; tombs[id] = { purged: true, updated: d.updated }; if (current === id) current = null; }
    else { notes[id] = sanitize(d); delete tombs[id]; }
  }
  let pulling = false;
  async function cloudPull() {
    if (!sb || !sbUser || pulling) return;
    pulling = true;
    try {
      setState("Sincronizando…");
      const { data, error } = await sb.from("notes").select("id,data");
      if (error) { setState("Não foi possível sincronizar agora. Tente de novo em instantes."); return; }
      const remote = {};
      for (const r of data) { remote[r.id] = r.data; mergeIn(r.id, r.data); }
      const push = [];
      const older = (id, u) => !remote[id] || (remote[id].updated || 0) < u;
      for (const [id, n] of Object.entries(notes)) if (older(id, n.updated)) push.push(id);
      for (const [id, t] of Object.entries(tombs)) if (older(id, t.updated)) push.push(id);
      if (older("__meta", meta.updated) && meta.updated) push.push("__meta");
      saveLocal();
      if (push.length) await cloudPush(push); else setState("Sincronizado");
      refresh();
    } finally { pulling = false; }
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && mode === "cloud") cloudPull(); });
  setInterval(() => { if (!document.hidden && mode === "cloud") cloudPull(); }, 60000);

  // ---------- teclado e controles ----------
  $("new-btn").addEventListener("click", newNote);
  $("search").addEventListener("input", (e) => { query = e.target.value; renderList(); });
  $("sort").value = prefs.sort;
  $("sort").addEventListener("change", (e) => { prefs.sort = e.target.value; savePrefs(); renderList(); });
  document.addEventListener("keydown", (e) => {
    if (e.defaultPrevented) return;
    if (e.key === "Escape") {
      if (!$("overlay").hidden) { closeOverlay(); return; }
      if ($("app").classList.contains("focus")) { setFocus(false); return; }
    }
    if (e.ctrlKey && e.altKey) {
      const k = e.key.toLowerCase();
      if (k === "n") { e.preventDefault(); newNote(); }
      else if (k === "p") { e.preventDefault(); togglePreview(); }
      else if (k === "f") { e.preventDefault(); setFocus(!$("app").classList.contains("focus")); }
    }
  });

  // ---------- inicialização ----------
  function afterReady() {
    const old = Object.entries(notes).filter(([, n]) => n.deletedAt && Date.now() - n.deletedAt > TRASH_DAYS * DAY).map(([id]) => id);
    if (old.length) purge(old);
  }
  function startLocal() {
    mode = "local";
    notes = {};
    for (const [id, d] of Object.entries(lsGet(K.notes, {}))) if (d && typeof d === "object") notes[id] = sanitize(d);
    meta = sanitizeMeta(lsGet(K.meta, {}));
    tombs = lsGet(K.tombs, {}) || {};
    ready = true;
    afterReady();
    setState("Salvo neste navegador");
    renderAll();
  }
  function startDb(db, userId) {
    mode = "db";
    dbCol = db.collection("data/users/" + userId);
    setState("Suas notas são privadas e ficam salvas na sua conta");
    dbCol.onSnapshot((snap) => {
      for (const ch of snap.docChanges()) {
        const id = ch.doc.id;
        if (id === "__meta") { if (ch.type !== "removed" && !writing.__meta) meta = sanitizeMeta(ch.doc.data()); continue; }
        if (ch.type === "removed") { if (!timers[id] && !writing[id]) { delete notes[id]; if (current === id) current = null; } continue; }
        if (timers[id] || writing[id] || ch.doc.metadata.hasPendingWrites) continue;
        const inc = sanitize(ch.doc.data());
        if (!notes[id] || inc.updated >= notes[id].updated) notes[id] = inc;
      }
      if (!ready) { ready = true; afterReady(); }
      refresh();
    }, () => setState("A conexão caiu. Recarregue a página para continuar salvando."));
  }

  renderAll();
  renderSync();
  (async () => {
    if (IN_ARTIFACT) {
      try {
        const [db, user, dl, assets] = await Promise.all(["db", "user", "downloads", "assets"].map((c) => window.claude.use(c)));
        dlCap = dl; assetsCap = assets;
        const userId = user ? await user.id() : null;
        if (db && userId) { startDb(db, userId); return; }
      } catch {}
    }
    startLocal();
    if (HAS_CLOUD) initCloud();
  })();
})();
</script>
</body>
</html>
